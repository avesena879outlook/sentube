<div
    id="result-container"
    class="loading-card"
    x-data
    x-init="setTimeout(() => { $ajax('/results?source={{ source }}&query={{ query | urlencode }}', { target: 'result-container' }) }, 1500)"
>
    <div class="loading-inner">
        <div class="spinner-wrap">
            <div class="spinner-ring"></div>
            <div class="spinner-dot"></div>
        </div>

        <p class="loading-label">ANALYZING</p>

        <h3 class="loading-title">
            {% if source == 'youtube' %} Crawling YouTube... {% else %}
            Processing CSV... {% endif %}
        </h3>

        <p class="loading-sub">
            {% if source == 'youtube' %}
            <i data-lucide="search" class="w-3 h-3 inline-block mr-1"></i>
            "{{ query }}" {% else %}
            <i
                data-lucide="file-spreadsheet"
                class="w-3 h-3 inline-block mr-1"
            ></i>
            {{ query }} {% endif %}
        </p>

        <div class="loading-steps">
            <div class="step">
                <i data-lucide="database" class="w-3 h-3"></i>
                <span>Preprocessing</span>
            </div>
            <div class="step-arrow">→</div>
            <div class="step">
                <i data-lucide="filter" class="w-3 h-3"></i>
                <span>mRMR</span>
            </div>
            <div class="step-arrow">→</div>
            <div class="step">
                <i data-lucide="cpu" class="w-3 h-3"></i>
                <span>SVM</span>
            </div>
        </div>
    </div>
</div>

<style>
    .loading-card {
        background: #111;
        border: 3px solid #111;
        box-shadow: 6px 6px 0 #444;
        border-radius: 16px;
        color: #f5f0e8;
        padding: 3rem 2rem;
        text-align: center;
    }

    .loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    .spinner-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        margin-bottom: 0.5rem;
    }

    .spinner-ring {
        position: absolute;
        inset: 0;
        border: 3px solid #444;
        border-top-color: #f5f0e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .spinner-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        background: #f5f0e8;
        border-radius: 50%;
        transform: translate(-50%, -50%);
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .loading-label {
        font-family: "Rubik", Arial, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        color: #888;
        text-transform: uppercase;
    }

    .loading-title {
        font-family: "Rubik", Arial, sans-serif;
        font-size: 1.75rem;
        font-weight: 800;
        color: #f5f0e8;
        margin: 0;
    }

    .loading-sub {
        font-family: "Rubik", Arial, sans-serif;
        font-size: 0.8rem;
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .loading-steps {
        margin-top: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 0.75rem 1.25rem;
    }

    .step {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: "Rubik", Arial, sans-serif;
        font-size: 0.72rem;
        color: #aaa;
    }

    .step-arrow {
        color: #555;
        font-size: 0.8rem;
    }
</style>

<script>
    if (window.lucide) lucide.createIcons();
</script>
